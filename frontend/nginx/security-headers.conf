# Security headers, in a file of their own because nginx does not merge
# `add_header` across levels: a location that declares any header of its own
# discards every header inherited from the server block. Cache headers are
# per-location by nature, so without this include the locations that set them
# would quietly serve no security headers at all. Every location that adds a
# header includes this file as well.
#
# Included from both the server block and each such location.

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Content-Security-Policy.
#
# `style-src` needs 'unsafe-inline': the app sets design tokens through style
# attributes (the zoom and stagger custom properties) and Vite inlines a small
# amount of critical CSS. `script-src` does not need it - the build emits no
# inline script.
#
# `connect-src 'self'` is the load-bearing line. Both APIs are reached through
# this server on same-origin paths, so a bundle that tried to call an external
# API directly - including the Secret Scanner, with a key someone had embedded
# in the client - would be blocked by the browser before the request left.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
